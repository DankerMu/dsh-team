services:
  platform:
    image: dsh-team-platform:local
    container_name: dsh-team-platform
    group_add:
      - "${DEPLOY_DOCKER_GID:?Set DEPLOY_DOCKER_GID to the Docker socket numeric group}"
    environment:
      PLATFORM_HOST: ${PLATFORM_HOST:?}
      PLATFORM_PORT: ${PLATFORM_PORT:?}
      PLATFORM_LOG_LEVEL: ${PLATFORM_LOG_LEVEL-info}
      PLATFORM_DATA_DIR: ${PLATFORM_DATA_DIR:?}
      PLATFORM_MANAGED_CONFIG_DIR: ${PLATFORM_MANAGED_CONFIG_DIR:?}
      PLATFORM_DOCKER_SOCKET: ${PLATFORM_DOCKER_SOCKET:?}
      PLATFORM_USER_IMAGE: ${PLATFORM_USER_IMAGE:?}
      PLATFORM_SECCOMP_PROFILE: ${PLATFORM_SECCOMP_PROFILE:?}
      PLATFORM_SUBNET_POOL: ${PLATFORM_SUBNET_POOL-172.30.0.0/16}
      PLATFORM_UPSTREAM_MODE: network
      PLATFORM_CONTAINER_NAME: dsh-team-platform
      PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:?}
      PLATFORM_COOKIE_SECURE: ${PLATFORM_COOKIE_SECURE-false}
      PLATFORM_TRUSTED_PROXIES: ${PLATFORM_TRUSTED_PROXIES:-}
      PLATFORM_INSTANCE_FONTS_DIR: ${PLATFORM_INSTANCE_FONTS_DIR:-}
      DOCUMENT_SERVER_CONTAINER_NAME: dsh-team-documentserver-net
      DOCUMENT_SERVER_JWT_SECRET: ${DOCUMENT_SERVER_JWT_SECRET:?Set DOCUMENT_SERVER_JWT_SECRET for the bundled Document Server}
    ports:
      - "${PLATFORM_PORT:?}:${PLATFORM_PORT:?}"
    networks:
      default:
        # Keep ingress connections on the primary gateway when employee networks attach.
        gw_priority: 1
    volumes:
      - type: bind
        source: ${PLATFORM_DOCKER_SOCKET:?}
        target: ${PLATFORM_DOCKER_SOCKET:?}
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_DATA_DIR:?}
        target: ${PLATFORM_DATA_DIR:?}
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_MANAGED_CONFIG_DIR:?}
        target: ${PLATFORM_MANAGED_CONFIG_DIR:?}
        bind:
          create_host_path: false
      # Same path, so the platform's readability check sees the source Docker binds into instances.
      # Unset: the checkout's secret-free deploy/ at a path the platform never reads.
      - type: bind
        source: ${PLATFORM_INSTANCE_FONTS_DIR:-./deploy}
        target: ${PLATFORM_INSTANCE_FONTS_DIR:-/opt/dsh-team/instance-fonts-unset}
        read_only: true
        bind:
          create_host_path: false
  # Owns the Document Server's network namespace (#624): inbound only loopback, replies and TCP 80,
  # so instances never reach docservice's 8000. The platform attaches this container to instances.
  documentserver-net:
    image: dsh-team-platform:local
    container_name: dsh-team-documentserver-net
    user: root
    cap_add:
      - NET_ADMIN
    entrypoint:
      - /app/deploy/document-server-net.sh
    tmpfs:
      - /run/dsh-team
    healthcheck:
      test:
        - CMD
        - test
        - -f
        - /run/dsh-team/firewall-ready
      interval: 30s
      start_period: 30s
      start_interval: 1s
      retries: 3
  documentserver:
    image: onlyoffice/documentserver:9.4.0
    container_name: dsh-team-documentserver
    network_mode: service:documentserver-net
    depends_on:
      documentserver-net:
        condition: service_healthy
        restart: true
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${DOCUMENT_SERVER_JWT_SECRET:?Set DOCUMENT_SERVER_JWT_SECRET for the bundled Document Server}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    # Ready only once run-document-server.sh reaches its final step, `xargs tail -F`: the allfonts
    # step before it restarts docservice and converter after /healthcheck already answers (#648).
    # The platform image the deploy stand-in runs has no pgrep, so grep scans each /proc cmdline
    # for argv[0] exactly `xargs`, then `tail` and `-F`. NUL-separated, the pattern never matches
    # its own sh or grep, the startup script's bash line, or the stack lane's `pgrep -f`, and never
    # spells the final step with spaces for that pgrep to see. Nothing waits on it: it is the operator's signal.
    # start_period covers the measured 70-135 s window with room for a first allfonts run on a
    # slow host; start_interval reports healthy within 5 s of the final step. Afterwards Docker's
    # default interval and retries (30 s, 3) turn a vanished final step unhealthy within ~90 s;
    # the probe is one grep over /proc, so 10 s of timeout only absorbs a loaded host.
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - grep -qsaP '^xargs\x00tail\x00-F\x00' /proc/*/cmdline
      interval: 30s
      timeout: 10s
      start_period: 300s
      start_interval: 5s
      retries: 3
    volumes:
      # Operator-supplied fonts, resolved from --project-directory (the repository root).
      - type: bind
        source: ./assets/fonts
        target: /usr/share/fonts/truetype/custom
        read_only: true
        bind:
          create_host_path: false
      # Command Service only from this namespace's loopback (#624); sorts before ds-docservice.conf.
      - type: bind
        source: ./deploy/document-server-command.conf
        target: /etc/nginx/includes/ds-acl-command.conf
        read_only: true
        bind:
          create_host_path: false
