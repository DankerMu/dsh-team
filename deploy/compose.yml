services:
  platform:
    image: dsh-team-platform:local
    container_name: dsh-team-platform
    group_add:
      - "${DEPLOY_DOCKER_GID:?Set DEPLOY_DOCKER_GID to the Docker socket numeric group}"
    environment:
      PLATFORM_HOST: ${PLATFORM_HOST:?}
      PLATFORM_PORT: ${PLATFORM_PORT:?}
      PLATFORM_LOG_LEVEL: ${PLATFORM_LOG_LEVEL-info}
      PLATFORM_DATA_DIR: ${PLATFORM_DATA_DIR:?}
      PLATFORM_MANAGED_CONFIG_DIR: ${PLATFORM_MANAGED_CONFIG_DIR:?}
      PLATFORM_DOCKER_SOCKET: ${PLATFORM_DOCKER_SOCKET:?}
      PLATFORM_USER_IMAGE: ${PLATFORM_USER_IMAGE:?}
      PLATFORM_SECCOMP_PROFILE: ${PLATFORM_SECCOMP_PROFILE:?}
      PLATFORM_SUBNET_POOL: ${PLATFORM_SUBNET_POOL-172.30.0.0/16}
      PLATFORM_UPSTREAM_MODE: network
      PLATFORM_CONTAINER_NAME: dsh-team-platform
      PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:?}
      PLATFORM_COOKIE_SECURE: ${PLATFORM_COOKIE_SECURE-false}
      PLATFORM_TRUSTED_PROXIES: ${PLATFORM_TRUSTED_PROXIES:-}
      PLATFORM_INSTANCE_FONTS_DIR: ${PLATFORM_INSTANCE_FONTS_DIR:-}
      DOCUMENT_SERVER_CONTAINER_NAME: dsh-team-documentserver
      DOCUMENT_SERVER_JWT_SECRET: ${DOCUMENT_SERVER_JWT_SECRET:?Set DOCUMENT_SERVER_JWT_SECRET for the bundled Document Server}
    ports:
      - "${PLATFORM_PORT:?}:${PLATFORM_PORT:?}"
    networks:
      default:
        # Keep ingress connections on the primary gateway when employee networks attach.
        gw_priority: 1
    volumes:
      - type: bind
        source: ${PLATFORM_DOCKER_SOCKET:?}
        target: ${PLATFORM_DOCKER_SOCKET:?}
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_DATA_DIR:?}
        target: ${PLATFORM_DATA_DIR:?}
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_MANAGED_CONFIG_DIR:?}
        target: ${PLATFORM_MANAGED_CONFIG_DIR:?}
        bind:
          create_host_path: false
      # Same path, so the platform's readability check sees the source Docker binds into instances.
      # Unset: the checkout's secret-free deploy/ at a path the platform never reads.
      - type: bind
        source: ${PLATFORM_INSTANCE_FONTS_DIR:-./deploy}
        target: ${PLATFORM_INSTANCE_FONTS_DIR:-/opt/dsh-team/instance-fonts-unset}
        read_only: true
        bind:
          create_host_path: false
  documentserver:
    image: onlyoffice/documentserver:9.4.0
    container_name: dsh-team-documentserver
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${DOCUMENT_SERVER_JWT_SECRET:?Set DOCUMENT_SERVER_JWT_SECRET for the bundled Document Server}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      # Operator-supplied fonts, resolved from --project-directory (the repository root).
      - type: bind
        source: ./assets/fonts
        target: /usr/share/fonts/truetype/custom
        read_only: true
        bind:
          create_host_path: false
