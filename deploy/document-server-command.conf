# Mounted read-only as /etc/nginx/includes/ds-acl-command.conf (#624). Every Command Service route
# variant (case, trailing slash, version prefix) answers 403 unless it comes from loopback inside
# the Document Server's own network namespace; ds.conf includes this before ds-docservice.conf.
location ~* ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(command|coauthoring\/commandservice\.ashx)\/?$ {
  allow 127.0.0.1;
  deny all;
  proxy_pass http://docservice;
}
