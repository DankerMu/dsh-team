# Mounted read-only as /etc/nginx/includes/ds-acl-command.conf (#624). Every request whose decoded
# path starts with a Command Service route (any case, optional version prefix, any suffix such as a
# trailing slash or a decoded %3F/%23 the image's version-prefix catch-all would pass on) answers 403
# unless it comes from loopback inside the Document Server's own network namespace; ds.conf
# includes this before ds-docservice.conf.
location ~* ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(command|coauthoring\/commandservice\.ashx) {
  allow 127.0.0.1;
  deny all;
  proxy_pass http://docservice;
}
