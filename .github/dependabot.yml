version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Releases younger than 7 days are skipped (constraints.yaml dependencies.min_release_age_days).
    cooldown:
      default-days: 7
    # @types/node tracks the pinned Node 24 runtime (.tool-versions); majors move with the runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # React 18 is the stack pin (AGENTS.md Stack & Versions); a React major is a design change.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # jsdom 30 requires Node ^24.15.0; revisit when .tool-versions moves past 24.13.1.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
