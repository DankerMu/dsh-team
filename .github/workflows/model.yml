name: Real model on trusted VPS

on:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: trusted-vps-model
  cancel-in-progress: false

jobs:
  model:
    if: github.repository == 'DankerMu/dsh-team' && github.actor == 'DankerMu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      # No model credential or Docker execution on the hosted coordinator.
      # Operator provisions a one-shot capability for this exact reviewed workflow/source SHA.
      - name: Execute approved model acceptance on giap-vps
        env:
          DSH_TEAM_VPS_CHANNEL: ${{ secrets[format('DSH_TEAM_VPS_CHANNEL_{0}', github.sha)] }}
        run: pnpm ci:model:invoke
