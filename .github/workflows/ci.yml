name: CI
run-name: CI / ${{ github.event.action || github.event_name }}

on:
  pull_request:
    # labeled/unlabeled: the diff-size and lockfile jobs read the exemption labels, so a
    # label change must re-run them; a label set while opening the PR is not in the
    # `opened` payload.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# PR deliveries must not cancel or evict same-head required checks, including
# repeated label events. Superseded PR runs may finish; main keeps its ref group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HURL_VERSION: "8.0.1"
  GITLEAKS_VERSION: "8.30.1"
  SHELLCHECK_VERSION: "0.10.0"
  SHELLCHECK_SHA256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"

jobs:
  layer1-fast-checks:
    name: Fast checks (fmt + lint + typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - name: Install shellcheck
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          sudo tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C /usr/local/bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"
      - run: pnpm lint
      - run: pnpm typecheck

  layer2-unit-tests:
    name: Unit tests + per-file coverage
    needs: layer1-fast-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  layer3-integration:
    name: Integration, build, contract, e2e
    needs: layer2-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm contract:check
      - name: Install hurl
        run: |
          curl -fsSL --retry 3 -o /tmp/hurl.deb \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/hurl.deb
      - name: Prepare fresh job-local Docker for real entrypoint reconciliation
        run: |
          sudo systemctl start docker
          docker version
          test -S /var/run/docker.sock
      - name: Smoke against the dev server
        env:
          PLATFORM_PUBLIC_URL: http://127.0.0.1:8080
          PLATFORM_UPSTREAM_MODE: published-loopback
        run: |
          pnpm dev:bg
          pnpm dev:status
          pnpm smoke
          pnpm dev:stop
      - name: End-to-end against the built artifact
        run: pnpm e2e

  platform-ui:
    name: Platform UI (built React + Chromium)
    needs: layer1-fast-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pnpm install runs on the host, which has the toolchain node-gyp needs; the tests run in the image, which ships
    # Chromium and its system libraries in /ms-playwright. Move the digest together with
    # @playwright/test (platform/web/README.md). Dependabot does not bump it.
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the image Playwright matches @playwright/test
        run: |
          node -e '
            const expected = require("@playwright/test/package.json").version;
            let info = {};
            let problem = "";
            try {
              const args = ["run", "--rm", process.env.PLAYWRIGHT_IMAGE, "cat", "/ms-playwright/.docker-info"];
              const record = require("node:child_process").execFileSync("docker", args, {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "inherit"],
              });
              info = Object(JSON.parse(record));
            } catch (error) {
              problem = ` (/ms-playwright/.docker-info: ${error.message})`;
            }
            const found = `@playwright/test ${expected}, image driverVersion ${info.driverVersion}, dockerImageName ${info.dockerImageName}${problem}`;
            if (info.driverVersion !== expected) {
              console.error(`Playwright image drift: ${found}`);
              process.exit(1);
            }
            console.log(`Playwright image matches: ${found}`);
          '
      # Host Node keeps the .tool-versions release; $PNPM_HOME holds the pnpm shim and the package it runs.
      # --init reaps Chromium's orphaned children and forwards signals (PID 1 ignores them).
      - name: Run the UI tests in the image with the host Node and pnpm
        run: |
          node_bin="$(command -v node)"
          pnpm_shim="$(command -v pnpm)"
          node_root="$(dirname "$(dirname "$(readlink -f "$node_bin")")")"
          pnpm_bin="$(dirname "$pnpm_shim")"
          docker run --rm --init --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI \
            -e PATH="$node_root/bin:$pnpm_bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -v "$node_root:$node_root:ro" -v "${PNPM_HOME:?}:$PNPM_HOME:ro" \
            "$PLAYWRIGHT_IMAGE" pnpm test:ui
      - name: Retain browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-ui
          path: reports/platform-ui/
          include-hidden-files: true
          if-no-files-found: error

  layer4-anti-drift:
    name: Anti-drift (duplicate + dead code)
    needs: layer1-fast-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm duplicate-code
      - run: pnpm dead-code

  layer5-secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" |
            sudo tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks git --redact --no-banner .

  sast:
    name: Static security analysis (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # --error makes any finding fail the job; rule packs are fetched from the Semgrep registry.
      - run: semgrep scan --config p/default --error --metrics=off

  guardrails:
    name: Guardrail self-test (every gate rejects its violation)
    needs: layer1-fast-checks
    runs-on: ubuntu-24.04
    # Measured basis (#747): 60 consecutive CI runs (main and PR, every attempt) created
    # 2026-11-25 06:46 to 2026-11-26 17:14 UTC. `pnpm test:guardrails` step, 60 completed
    # attempts (3 of them job-cancelled after the step finished): median 6:33, p90 9:14 (nearest
    # rank), max 9:43; job-success only (57): median 6:32, p90 8:42, max 9:27. 7 attempts were
    # cancelled at the old 10m limit; 4 were killed mid-step, the longest at 9:57 (a lower bound).
    # Job overhead (job minus step) is at most 34 s.
    # Rule: max(15, ceil((1.5 * S + O) / 60)), S = 597 s, O = 34 s -> 16.
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" |
            sudo tar -xz -C /usr/local/bin gitleaks
      - name: Install shellcheck
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          sudo tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C /usr/local/bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"
      - run: pnpm test:guardrails

  docker-evidence:
    name: Trusted Docker and Compose evidence (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Markdown outside plugins/ and images/, and the OpenSpec CLI's change
      # metadata (.openspec.yaml directly in openspec/changes/<change>/ or
      # openspec/changes/archive/YYYY-MM-DD-<change>/), cannot change what the
      # Docker suites build or run, so a diff made only of them needs no trusted
      # Docker evidence (scripts/docs-only-diff.sh). Plugin and image Markdown
      # (skills, prompts) ships in images: never exempt. Classifier exit 1 means
      # evidence required; any other failure fails the step. The job still runs
      # and succeeds, so the aggregator never sees "skipped". File names are
      # PR-controlled and the runner parses `##[...]` anywhere in a line, so the
      # verdict is printed only between stop-commands markers with a fresh
      # random token (scripts/test-guardrails.sh runs this step's text). On
      # pull_request the range is the merge ref's own HEAD^1...HEAD^2, never the
      # payload's stale base.sha, and a non-merge HEAD fails the step (#734).
      - name: Detect documentation-only change
        id: scope
        env:
          RANGE: >-
            ${{ github.event_name == 'pull_request'
            && 'HEAD^1...HEAD^2'
            || format('{0}..{1}', github.event.before, github.event.after) }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bash scripts/pr-merge-ref.sh || exit 1
          fi
          # NUL-delimited and byte-exact (#715): without -z, git C-quotes non-ASCII
          # names. Command substitution drops NULs, so the list goes through a file.
          changed="$(mktemp)"
          trap 'rm -f "$changed"' EXIT
          git diff -z --no-renames --name-only --end-of-options "$RANGE" -- >"$changed"
          token="$(od -An -N16 -tx1 /dev/urandom | tr -dc '0-9a-f')"
          [ "${#token}" -eq 32 ] || exit 2
          if verdict="$(bash scripts/docs-only-diff.sh <"$changed")"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change ($RANGE); trusted Docker evidence not required:"
            echo "::stop-commands::$token"
            printf '%s\n' "$verdict"
            echo "::$token::"
          else
            rc=$?
            echo "::stop-commands::$token"
            printf '%s\n' "$verdict"
            echo "::$token::"
            [ "$rc" -eq 1 ] || exit "$rc"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.scope.outputs.docs_only != 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version-file: .tool-versions
      # Full test:docker discovery includes deployment.docker.test.ts. Trusted
      # orchestration also runs test:deploy on that head before publishing proof;
      # hosted CI receives no VPS credentials and cannot substitute an older run.
      - name: Verify exact-head owner evidence or proved squash tree equivalence
        if: steps.scope.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm verify:docker-evidence

  # The CI layer of the commit-message and naming gates (#665): the PR's own
  # commits (base..head) and added/renamed paths (base...head). The head is the
  # PR head, not the synthetic merge checkout. Only the steps are PR-only: on
  # push the job runs, skips them and succeeds, so the aggregator never sees
  # "skipped" and main history is never re-checked.
  pr-range:
    name: PR range (commit messages + naming)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: github.event_name == 'pull_request'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event_name == 'pull_request'
      - name: Lint the PR's commit messages and added paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm lint:pr "$BASE_SHA" "$HEAD_SHA"

  # Outside the aggregator: these two run only on pull_request events and would
  # report "skipped" on push builds.
  lockfile-consistency:
    name: Lockfile-manifest consistency
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The PR's own paths: the merge ref's HEAD^1...HEAD^2, never the payload's
      # stale base.sha (#734; scripts/test-guardrails.sh runs this step's text).
      - name: Check lockfile–manifest pairs
        if: "!contains(github.event.pull_request.labels.*.name, 'lockfile-refresh')"
        run: |
          bash scripts/pr-merge-ref.sh || exit 1
          changed="$(git diff --name-only 'HEAD^1...HEAD^2')"
          if echo "$changed" | grep -qx "pnpm-lock.yaml" &&
            ! echo "$changed" | grep -qE '(^|/)package\.json$'; then
            echo "::error::pnpm-lock.yaml changed but no package.json did. Lockfile-only changes are unreviewed dependency drift. Revert the lockfile, or add the 'lockfile-refresh' label with a justification in the PR description."
            exit 1
          fi
          echo "lockfile-consistency: lockfile and manifests agree."

  diff-size-guard:
    name: PR diff size guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      # The pull_request checkout is the merge ref: HEAD^1 is the current base tip
      # and HEAD^2 the PR head, so the payload's base.sha (not refreshed when main
      # advances) is never used. scripts/pr-merge-ref.sh and scripts/pr-diff-lines.sh
      # fail closed (#715, #734).
      - name: Enforce max PR diff lines
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'diff-limit-exempt') }}
        run: |
          MAX_DIFF_LINES="$(node scripts/constraints.mjs size_limits max_pr_diff_lines)"
          bash scripts/pr-merge-ref.sh || exit 1
          LINES="$(bash scripts/pr-diff-lines.sh 'HEAD^1' 'HEAD^2')" || exit 1
          case "$LINES" in '' | *[!0-9]*) echo "::error::Cannot count the PR diff." && exit 1 ;; esac
          echo "Changed lines (excluding lockfile and generated contract): $LINES (limit: $MAX_DIFF_LINES)"
          if [ "$LINES" -gt "$MAX_DIFF_LINES" ]; then
            echo "::error::PR exceeds the ${MAX_DIFF_LINES}-line diff limit. Split it, or add the 'diff-limit-exempt' label with a justification in the PR description."
            exit 1
          fi

  # Branch protection requires ONLY this check. GitHub treats a skipped required
  # check as passing, so `if: always()` is load-bearing: this job always runs and
  # fails when any dependency failed, was cancelled, or was skipped.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      - layer1-fast-checks
      - layer2-unit-tests
      - layer3-integration
      - platform-ui
      - layer4-anti-drift
      - layer5-secret-scan
      - sast
      - guardrails
      - docker-evidence
      - pr-range
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail on any failed, cancelled, or skipped required job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "::error::A required job failed, was cancelled, or was skipped. Skipped counts as failure because GitHub counts a skipped required check as passing."
            exit 1
          fi
